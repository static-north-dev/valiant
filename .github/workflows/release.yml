name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  prepare:
    name: verify and package release
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash .github/scripts/derive-release-version.sh "$RELEASE_TAG" "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.Release.slnf --locked-mode

      - name: Build
        run: >
          dotnet build StaticNorth.Valiant.Release.slnf
          --configuration Release
          --no-restore
          --disable-build-servers
          -p:Version="${{ steps.version.outputs.package_version }}"
          -p:PackageVersion="${{ steps.version.outputs.package_version }}"

      - name: Test
        run: dotnet test --solution StaticNorth.Valiant.Release.slnf --configuration Release --no-build

      - name: Audit dependencies
        shell: bash
        run: |
          projects=()
          while IFS= read -r project; do
            projects+=("$project")
          done < <(dotnet sln StaticNorth.Valiant.Release.slnf list | awk '/\.csproj$/')

          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No PackageReference projects were found in StaticNorth.Valiant.Release.slnf." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "::group::Audit $project"
            dotnet list "$project" package --vulnerable --include-transitive --no-restore
            echo "::endgroup::"
          done

      - name: Pack, inspect, and run leaf consumers
        run: >
          dotnet msbuild StaticNorth.Valiant.Pack.proj
          -t:VerifyPackageConsumers
          -m:1
          -p:Configuration=Release
          -p:NoBuild=true
          -p:PackageVersion="${{ steps.version.outputs.package_version }}"

      - name: Publish and run Native AOT package smoke
        run: >
          dotnet msbuild StaticNorth.Valiant.Pack.proj
          -t:VerifyAotSmoke
          -m:1
          -p:Configuration=Release
          -p:NoBuild=true
          -p:PackageVersion="${{ steps.version.outputs.package_version }}"
          -p:AotRuntimeIdentifier=linux-x64

      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valiant-packages-${{ steps.version.outputs.package_version }}
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: publish NuGet packages
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.110

      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: valiant-packages-${{ needs.prepare.outputs.package_version }}
          path: artifacts/packages

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NuGet trusted publishing did not return a temporary API key." >&2
            exit 1
          fi

          for package in "$PACKAGE_OUTPUT"/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
