name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  prepare:
    name: verify and package release
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash .github/scripts/derive-release-version.sh "$RELEASE_TAG" "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.Release.slnf --locked-mode

      - name: Build
        run: >
          dotnet build StaticNorth.Valiant.Release.slnf
          --configuration Release
          --no-restore
          --disable-build-servers
          -p:Version="${{ steps.version.outputs.package_version }}"
          -p:PackageVersion="${{ steps.version.outputs.package_version }}"

      - name: Test
        run: dotnet test --solution StaticNorth.Valiant.Release.slnf --configuration Release --no-build

      - name: Audit dependencies
        shell: bash
        run: |
          projects=()
          while IFS= read -r project; do
            projects+=("$project")
          done < <(dotnet sln StaticNorth.Valiant.Release.slnf list | awk '/\.csproj$/')

          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No PackageReference projects were found in StaticNorth.Valiant.Release.slnf." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "::group::Audit $project"
            dotnet list "$project" package --vulnerable --include-transitive --no-restore
            echo "::endgroup::"
          done

      - name: Verify packages, consumers, and Native AOT
        id: verified
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          output="$(mktemp -d "${RUNNER_TEMP}/valiant-${PACKAGE_VERSION}.XXXXXX")"
          dotnet msbuild StaticNorth.Valiant.Pack.proj \
            -t:VerifyPackageConsumers,VerifyAotSmoke \
            -m:1 -p:Configuration=Release -p:NoBuild=true \
            -p:PackageVersion="$PACKAGE_VERSION" -p:PackageOutputPath="$output" \
            -p:AotRuntimeIdentifier=linux-x64
          {
            echo 'paths<<VERIFIED_PACKAGES'
            echo "$output/verified-packages.sha256"
            while read -r checksum file; do
              echo "$output/$file"
            done < "$output/verified-packages.sha256"
            echo 'VERIFIED_PACKAGES'
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valiant-packages-${{ steps.version.outputs.package_version }}
          path: ${{ steps.verified.outputs.paths }}
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: publish NuGet packages
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100

      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valiant-packages-${{ needs.prepare.outputs.package_version }}
          path: artifacts/packages

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        working-directory: artifacts/packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NuGet trusted publishing did not return a temporary API key." >&2
            exit 1
          fi

          sha256sum --strict --check verified-packages.sha256
          packages=()
          while read -r checksum file; do
            [[ "$file" == *.nupkg ]] || continue
            package_id="${file%.${PACKAGE_VERSION}.nupkg}"
            package_id="${package_id,,}"
            version="${PACKAGE_VERSION,,}"
            status="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' \
              --retry 3 --max-time 30 "https://api.nuget.org/v3-flatcontainer/$package_id/$version/$package_id.$version.nupkg")"
            if [[ "$status" != 404 ]]; then
              echo "Cannot publish $file. NuGet package availability check returned HTTP $status." >&2
              exit 1
            fi
            packages+=("$file")
          done < verified-packages.sha256

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No verified NuGet packages were found." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE"
          done
