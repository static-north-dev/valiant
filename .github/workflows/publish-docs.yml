name: Publish Docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publication
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT: valiant-docs
  CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main

jobs:
  prepare:
    name: pin documentation source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      docs_major: ${{ steps.source.outputs.docs_major }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Checkout canonical documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: docs-source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read current documentation major and source SHA
        id: source
        shell: bash
        working-directory: docs-source
        run: |
          docs_major="$(node docs/scripts/current-major.js)"
          source_sha="$(git rev-parse HEAD)"
          echo "docs_major=$docs_major" >>"$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"

  generate-docs-snapshot:
    name: generate documentation snapshot
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: docs-source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-source/docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-source/docs

      - name: Test documentation tooling
        run: npm run test:docs-versions
        working-directory: docs-source/docs

      - name: Audit documentation dependencies
        run: npm run audit:dependencies
        working-directory: docs-source/docs

      - name: Generate current major snapshot
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
        run: npm run docs:snapshot-major -- "$DOCS_MAJOR"
        working-directory: docs-source/docs

      - name: Stage constrained snapshot artifact
        shell: bash
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
          SNAPSHOT_ROOT: ${{ runner.temp }}/docs-snapshot
        run: |
          mkdir -p "$SNAPSHOT_ROOT"
          snapshot_paths=(
            "versioned_docs/version-$DOCS_MAJOR"
            "versioned_sidebars/version-$DOCS_MAJOR-sidebars.json"
          )

          for relative_path in "${snapshot_paths[@]}"; do
            source_path="docs-source/docs/$relative_path"
            if [ ! -e "$source_path" ]; then
              echo "Missing generated snapshot path: $relative_path" >&2
              exit 1
            fi

            if [ -L "$source_path" ] ||
               find "$source_path" -type l -print -quit | grep -q .; then
              echo "Generated snapshot path contains a symlink: $relative_path" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$SNAPSHOT_ROOT/$relative_path")"
            cp -R "$source_path" "$SNAPSHOT_ROOT/$relative_path"
          done

      - name: Upload documentation snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valiant-docs-snapshot-${{ needs.prepare.outputs.docs_major }}
          path: ${{ runner.temp }}/docs-snapshot
          if-no-files-found: error
          retention-days: 7

  verify-docs-candidate:
    name: verify candidate documentation history
    needs:
      - prepare
      - generate-docs-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pinned documentation history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: docs-history
          persist-credentials: false

      - name: Download documentation snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valiant-docs-snapshot-${{ needs.prepare.outputs.docs_major }}
          path: ${{ runner.temp }}/docs-snapshot

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-history/docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-history/docs

      - name: Import current major into complete history
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
          SNAPSHOT_ROOT: ${{ runner.temp }}/docs-snapshot
        run: npm run docs:import-major -- "$DOCS_MAJOR" "$SNAPSHOT_ROOT"
        working-directory: docs-history/docs

      - name: Validate documentation major
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
        run: npm run docs:validate-major -- "$DOCS_MAJOR"
        working-directory: docs-history/docs

      - name: Build candidate documentation
        env:
          DOCS_INCLUDE_CURRENT: false
        run: npm run build
        working-directory: docs-history/docs

      - name: Validate candidate agent documentation
        run: npm run docs:check-agent-artifacts
        working-directory: docs-history/docs

      - name: Validate every generated major route
        shell: bash
        working-directory: docs-history
        run: |
          mapfile -t majors < <(node -e "for (const version of require('./docs/versions.json')) console.log(version)")
          if [ "${#majors[@]}" -eq 0 ]; then
            echo "No documentation majors were generated." >&2
            exit 1
          fi

          newest_major="${majors[0]}"
          for product in validation endpoints mapping settings; do
            for major in "${majors[@]}"; do
              if [ "$major" = "$newest_major" ]; then
                route="docs/build/$product/index.html"
              else
                route="docs/build/$major/$product/index.html"
              fi

              if [ ! -f "$route" ]; then
                echo "Missing generated documentation route: $route" >&2
                exit 1
              fi
            done
          done

  propose-docs-snapshot:
    name: stage documentation snapshot for review
    needs:
      - prepare
      - generate-docs-snapshot
      - verify-docs-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      snapshot_pending: ${{ steps.propose.outputs.snapshot_pending }}

    steps:
      - name: Checkout pinned documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download validated documentation snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valiant-docs-snapshot-${{ needs.prepare.outputs.docs_major }}
          path: ${{ runner.temp }}/docs-snapshot

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Import and stage documentation snapshot
        id: propose
        shell: bash
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
          DOCS_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SNAPSHOT_ROOT: ${{ runner.temp }}/docs-snapshot
        run: |
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [ "$remote_head" != "$DOCS_SOURCE_SHA" ]; then
            echo "main moved from $DOCS_SOURCE_SHA to $remote_head during snapshot generation." >&2
            echo "Run Publish Docs again from the new head." >&2
            exit 1
          fi

          current_major="$(node docs/scripts/current-major.js)"
          if [ "$current_major" != "$DOCS_MAJOR" ]; then
            echo "The tracked documentation major changed during publication." >&2
            echo "Run the Publish Docs workflow again." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node docs/scripts/docs-versions.js import "$DOCS_MAJOR" "$SNAPSHOT_ROOT"
          node docs/scripts/docs-versions.js validate "$DOCS_MAJOR"

          git add \
            docs/versions.json \
            docs/versioned_docs \
            docs/versioned_sidebars

          if git diff --cached --quiet; then
            echo "snapshot_pending=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          snapshot_branch="docs/snapshot-v$DOCS_MAJOR-$DOCS_SOURCE_SHA"
          snapshot_ref="refs/heads/$snapshot_branch"
          snapshot_tree="$(git write-tree)"

          existing_snapshot="$(git ls-remote --heads origin "$snapshot_ref")"
          if [ -n "$existing_snapshot" ]; then
            git fetch origin "$snapshot_ref"
            if [ "$(git rev-parse FETCH_HEAD^)" != "$DOCS_SOURCE_SHA" ] ||
               [ "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$snapshot_tree" ]; then
              echo "The existing snapshot branch differs from the generated snapshot." >&2
              exit 1
            fi
          else
            git commit -m "docs: publish v$DOCS_MAJOR from ${DOCS_SOURCE_SHA:0:12}"
            git push origin "HEAD:$snapshot_ref"
          fi

          echo "snapshot_pending=true" >>"$GITHUB_OUTPUT"
          compare_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$snapshot_branch?expand=1"
          printf '%s\n' \
            "[Open the documentation snapshot pull request]($compare_url)" \
            "Merge it after CI passes, then run Publish Docs from main again." \
            >>"$GITHUB_STEP_SUMMARY"

  verify-docs:
    name: verify reviewed documentation
    if: needs.propose-docs-snapshot.outputs.snapshot_pending == 'false'
    needs:
      - prepare
      - propose-docs-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout reviewed documentation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Test reviewed documentation
        run: npm run test:docs-versions
        working-directory: docs

      - name: Audit documentation dependencies
        run: npm run audit:dependencies
        working-directory: docs

      - name: Validate documentation major
        env:
          DOCS_MAJOR: ${{ needs.prepare.outputs.docs_major }}
        run: npm run docs:validate-major -- "$DOCS_MAJOR"
        working-directory: docs

      - name: Build reviewed documentation
        env:
          DOCS_INCLUDE_CURRENT: false
        run: npm run build
        working-directory: docs

      - name: Validate reviewed agent documentation
        run: npm run docs:check-agent-artifacts
        working-directory: docs

      - name: Validate every reviewed major route
        shell: bash
        run: |
          mapfile -t majors < <(node -e "for (const version of require('./docs/versions.json')) console.log(version)")
          if [ "${#majors[@]}" -eq 0 ]; then
            echo "No documentation majors were generated." >&2
            exit 1
          fi

          newest_major="${majors[0]}"
          for product in validation endpoints mapping settings; do
            for major in "${majors[@]}"; do
              if [ "$major" = "$newest_major" ]; then
                route="docs/build/$product/index.html"
              else
                route="docs/build/$major/$product/index.html"
              fi

              if [ ! -f "$route" ]; then
                echo "Missing generated documentation route: $route" >&2
                exit 1
              fi
            done
          done

      - name: Upload verified documentation site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valiant-docs-${{ needs.prepare.outputs.docs_major }}
          path: docs/build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy-docs:
    name: deploy documentation to Cloudflare Pages
    needs:
      - prepare
      - verify-docs
    runs-on: ubuntu-latest
    environment: docs-production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout reviewed documentation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Download verified documentation site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: valiant-docs-${{ needs.prepare.outputs.docs_major }}
          path: docs/build

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate downloaded agent documentation
        run: node docs/scripts/check-agent-artifacts.mjs docs/build

      - name: Check the reviewed commit is still current
        shell: bash
        env:
          DOCS_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          read -r remote_head _ < <(git ls-remote --exit-code origin refs/heads/main)
          if [ "$remote_head" != "$DOCS_SOURCE_SHA" ]; then
            echo "main moved during publication. Run Publish Docs again from the new head." >&2
            exit 1
          fi

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/ensure-cloudflare-pages-project.sh

      - name: Deploy documentation
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.156.1
          workingDirectory: docs
          command: pages deploy build --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}

      - name: Verify deployed Pages documentation
        shell: bash
        env:
          DOCS_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DOCS_EXPECTED_REVISION: ${{ needs.prepare.outputs.source_sha }}
        run: node docs/scripts/check-agent-http.mjs "${DOCS_DEPLOYMENT_URL:?Wrangler did not return a deployment URL}"
