name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.sln --locked-mode

      - name: Build
        run: dotnet build StaticNorth.Valiant.sln --configuration Release --no-restore --disable-build-servers

      - name: Test
        run: dotnet test --solution StaticNorth.Valiant.sln --configuration Release --no-build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: '**/bin/**/TestResults/**'
          if-no-files-found: warn
          retention-days: 14

  package-consumers:
    name: pack and consume
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.sln --locked-mode

      - name: Build
        run: dotnet build StaticNorth.Valiant.sln --configuration Release --no-restore --disable-build-servers

      - name: Pack, inspect, and run leaf consumers
        run: dotnet msbuild StaticNorth.Valiant.Pack.proj -t:VerifyPackageConsumers -m:1 -p:Configuration=Release -p:NoBuild=true

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valiant-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
          retention-days: 14

  native-aot:
    name: native aot (linux x64)
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.sln --locked-mode

      - name: Build
        run: dotnet build StaticNorth.Valiant.sln --configuration Release --no-restore --disable-build-servers

      - name: Publish and run Native AOT package smoke
        run: dotnet msbuild StaticNorth.Valiant.Pack.proj -t:VerifyAotSmoke -m:1 -p:Configuration=Release -p:NoBuild=true -p:AotRuntimeIdentifier=linux-x64

  build-docs:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs

      - name: Audit documentation dependencies
        run: npm run audit:dependencies
        working-directory: docs

      - name: Test documentation versioning
        run: npm run test:docs-versions
        working-directory: docs

      - name: Build documentation
        run: npm run build
        working-directory: docs

      - name: Validate generated agent documentation
        run: npm run docs:check-agent-artifacts
        working-directory: docs

  dependency-audit:
    name: dependency advisory audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Report .NET SDK
        run: dotnet --version

      - name: Restore locked dependency graph
        run: dotnet restore StaticNorth.Valiant.sln --locked-mode

      - name: Audit dependencies
        shell: bash
        run: |
          projects=()
          while IFS= read -r project; do
            projects+=("$project")
          done < <(dotnet sln StaticNorth.Valiant.sln list | awk '/\.csproj$/')

          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No PackageReference projects were found in StaticNorth.Valiant.sln." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "::group::Audit $project"
            dotnet list "$project" package --vulnerable --include-transitive --no-restore
            echo "::endgroup::"
          done
