name: Publish Preview Packages

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version to publish, for example 0.1.0-preview.2.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_OUTPUT: artifacts/packages
      PACKAGE_VERSION: ${{ inputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Valiant.sln --locked-mode

      - name: Build
        run: dotnet build Valiant.sln --configuration Release --no-restore --disable-build-servers

      - name: Test
        run: dotnet test --solution Valiant.sln --configuration Release --no-build

      - name: Validate package version
        run: |
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "package_version input is required." >&2
            exit 1
          fi

          echo "Publishing NuGet package version $PACKAGE_VERSION"

      - name: Pack, inspect, and run leaf consumers
        run: dotnet msbuild Valiant.Pack.proj -t:VerifyPackageConsumers -m:1 -p:Configuration=Release -p:NoBuild=true -p:PackageVersion="$PACKAGE_VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valiant-preview-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          if [ -z "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" ]; then
            echo "NuGet trusted publishing did not return a temporary API key." >&2
            exit 1
          fi

          for package in "$PACKAGE_OUTPUT"/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
