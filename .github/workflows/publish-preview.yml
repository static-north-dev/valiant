name: Publish Preview Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      PACKAGE_OUTPUT: artifacts/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Valiant.sln

      - name: Build
        run: dotnet build Valiant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/Valiant.Validation.Tests/Valiant.Validation.Tests.csproj --configuration Release --no-build

      - name: Pack Valiant
        run: dotnet pack src/Valiant.Validation/Valiant.Validation.csproj --configuration Release --no-build --no-restore --output "$PACKAGE_OUTPUT"

      - name: Pack ASP.NET Core integration
        run: dotnet pack src/Valiant.Validation.AspNetCore/Valiant.Validation.AspNetCore.csproj --configuration Release --no-build --no-restore --output "$PACKAGE_OUTPUT"

      - name: Pack OpenAPI integration
        run: dotnet pack src/Valiant.Validation.AspNetCore.OpenApi/Valiant.Validation.AspNetCore.OpenApi.csproj --configuration Release --no-build --no-restore --output "$PACKAGE_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valiant-preview-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: staticNorth

      - name: Publish to NuGet
        run: |
          if [ -z "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" ]; then
            echo "NuGet trusted publishing did not return a temporary API key." >&2
            exit 1
          fi

          for package in "$PACKAGE_OUTPUT"/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
